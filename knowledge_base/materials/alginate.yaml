    Sodium alginate exhibits excellent cytocompatibility and is widely
    used for cell encapsulation because of its mild ionic gelation.
    However, native alginate lacks natural cell adhesion motifs such as
    RGD peptides, so cell attachment is generally poor unless chemically
    modified or blended with bioactive materials such as gelatin,
    collagen, or RGD-functionalized alginate.

