# 1. Material Information
Material Information:
  Material Name: "Alginate"
  Scientific Name: "Sodium Alginate"

  Common Names:
    - "Algin"
    - "Alginic Acid Sodium Salt"

  Abbreviation: "SA"

  Description: >
    Sodium alginate is a naturally occurring anionic polysaccharide
    extracted primarily from the cell walls of brown seaweeds.
    It is one of the most widely used biomaterials in 3D bioprinting
    due to its excellent biocompatibility, rapid ionic gelation with
    divalent cations, shear-thinning behavior, and ability to form
    mechanically stable hydrogels. Because of its mild gelation process,
    sodium alginate is extensively used for cell encapsulation,
    tissue engineering, regenerative medicine, drug delivery,
    and biofabrication.

  Source:
    Category: "Natural"

    Primary Sources:
      - "Brown Seaweed"

    Major Species:
      - "Laminaria spp."
      - "Macrocystis pyrifera"
      - "Ascophyllum nodosum"

  Material Type: "Natural Polymer"

  Polymer Class: "Anionic Polysaccharide"

  Origin: "Marine"

  Grade:
    - "Research Grade"
    - "Medical Grade"
    - "Pharmaceutical Grade"
    - "Food Grade"

  CAS Number: "9005-38-3"

  Chemical Formula: "(C6H7NaO6)n"

  FDA Status:
    Food Use: "GRAS (21 CFR 184.1724)"
    Biomedical Use: "Not specifically FDA approved as a bioink"

  Printable: true

  Bioink Role:
    - "Structural Hydrogel"
    - "Cell Encapsulation Matrix"
    - "Extrusion Bioink"

  Commercial Availability: "High"

  Typical Suppliers:
