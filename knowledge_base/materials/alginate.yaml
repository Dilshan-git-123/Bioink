# 12. Optimization Guidelines
Optimization Guidelines:
  If viscosity is low: Increase alginate concentration or blend with nanocellulose.
  If shape fidelity is poor: Increase crosslinker concentration or pre-crosslink lightly before printing.
  If clogging occurs: Decrease concentration, increase nozzle diameter, or improve dissolution.
  If degradation is too fast: Use a stronger crosslinker (e.g., BaCl₂) or increase polymer concentration.
  If degradation is too slow: Oxidize alginate and blend with rapidly degrading polymers (e.g., gelatin).

