Name: Genipin
Works With:
  - Gelatin
  - Chitosan
Does Not Crosslink:
  - Alginate
Typical Concentration: 0.1-1.0% w/v
Mechanism: Covalent crosslinking of primary amine groups.
Advantages:
  - Naturally derived
  - Less toxic than glutaraldehyde
Limitations:
  - Slow crosslinking time
  - Causes blue discoloration
References:
  - "Genipin as a Natural Crosslinker" (2017)
